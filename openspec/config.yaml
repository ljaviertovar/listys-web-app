schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

rules:
  tasks:
    - Do not add a "verify ..." test per task. Add at most one verification task per capability, and name the AGENTS.md
      test-gate consequence it protects (data loss/leak, wrong money, state/concurrency guarantee, repeated bug, core
      user journey). Tasks with no such consequence get no test.
  design:
    - Test strategy follows the AGENTS.md "Testing Expectations" gate, one layer per rule; do not plan per-endpoint case
      matrices or tests for view-models, copy, formatting or navigation.

operations:
  apply:
    guidance:
      - Add tests only when they meet the AGENTS.md test gate and stay within its per-change budget.
      - Do not report test counts as evidence of progress; report which gate consequence each new test protects.
