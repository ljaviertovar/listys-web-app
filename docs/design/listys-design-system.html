      <p style="margin:0;max-width:860px;font-size:16px;line-height:1.6;color:#475569">A1 expresado con los componentes y la escala nativos de shadcn (estilo radix-maia) y de Tailwind: tokens semánticos, tamaños y variantes por prop (size, variant, rounded), radios y espaciados de la escala y ninguna clase custom de tema. Tipografías, iconos Hugeicons y contenido de Listys sin cambios. La tab bar, la pastilla de sesión y las secciones del dashboard están en «09 · Móvil A1» (cuarta parte).</p>

    <p style="margin:0;max-width:820px;font-size:15px;line-height:1.6;color:#475569">El tema vive en los tokens de <b>globals.css</b> y en el código de <b>components/ui/*</b>; las pantallas solo pasan props. Cada medida del diseño es la del escalón nativo más cercano de shadcn y Tailwind, de modo que no hacen falta clases custom salvo para lo que la librería no resuelve (degradado del primario, tintas por categoría, hover de fila).</p>

.card{display:flex;flex-direction:column;padding:20px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.04),0 6px 20px -8px rgba(15,23,42,.12);box-sizing:border-box;min-width:0}

.row-w{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;border:0;box-sizing:border-box;font:600 14px/1 'Plus Jakarta Sans',sans-serif;white-space:nowrap;transition:background .15s,transform .1s;cursor:pointer}
.b-xs{height:24px;padding:0 10px;font-size:12px;gap:4px}
.b-sm{height:32px;padding:0 12px;font-size:14px;gap:4px}
.b-lg{height:40px;padding:0 16px;font-size:14px;gap:6px}
.b-xl{height:44px;padding:0 24px;font-size:16px;gap:8px}
.bi{width:36px;padding:0}.bi.b-xs{width:24px}.bi.b-sm{width:32px}.bi.b-lg{width:40px}.bi.b-xl{width:44px}
.b-primary{background:#2563EB;color:#fff}.b-primary:hover{background:#1D4ED8;color:#fff}
.b-secondary{background:#E9ECF0;color:#1D4ED8}.b-secondary:hover{background:#DEE2E8}
.b-outline{background:#fff;color:#0F172A;box-shadow:inset 0 0 0 1px #E2E8F0}.b-outline:hover{background:#F8FAFC}
.b-link{background:transparent;color:#2563EB;padding:0 4px}.b-link:hover{text-decoration:underline}
.b-ghost{background:transparent;color:#0F172A}.b-ghost:hover{background:#E9ECF0}
.b-danger{background:#DC2626;color:#fff}.b-danger:hover{background:#B91C1C;color:#fff}
.b-danger-soft{background:#FEE2E2;color:#B91C1C}.b-danger-soft:hover{background:#FECACA}
.b-hero{height:52px;padding:0 28px;gap:10px;font:600 16px/1 'Plus Jakarta Sans',sans-serif;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)),#2563EB;box-shadow:0 14px 28px -14px rgba(37,99,235,.85)}
.b-hero:hover{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)),#1D4ED8}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:#F1F5F9;color:#334155;font:600 12px/1 'Inter',sans-serif;white-space:nowrap;flex:none}
.c-success{background:#DCFCE7;color:#15803D}.c-warning{background:#FEF3C7;color:#B45309}.c-danger{background:#FEE2E2;color:#B91C1C}.c-accent{background:#DBEAFE;color:#1D4ED8}
.in{box-sizing:border-box;width:100%;height:44px;padding:0 14px;border:0;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(15,23,42,.06),0 2px 6px -2px rgba(15,23,42,.1);font:400 16px/1 'Inter',sans-serif;color:#0F172A;outline:none}
.in-filled{background:#E9ECF0;box-shadow:none}
.cb{width:20px;height:20px;border-radius:6px;background:#2563EB;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.sw{width:44px;height:26px;border-radius:999px;background:#2563EB;display:inline-flex;align-items:center;padding:3px;box-sizing:border-box;justify-content:flex-end}
.sw span{width:26px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.25)}
.sw.off{background:#DEE2E8;justify-content:flex-start}
.rd{width:20px;height:20px;border-radius:999px;box-sizing:border-box;border:6px solid #2563EB;background:#fff;display:inline-block}
.rd.off{border:1.5px solid #CBD5E1}
.spin{display:inline-block;width:20px;height:20px;box-sizing:border-box;border-radius:999px;border:2.5px solid #BFDBFE;border-top-color:#2563EB;flex:none}
.sl{position:relative;display:block;height:24px;border-radius:999px;background:#E9ECF0}
.sl span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#2563EB}
.sl i{position:absolute;left:calc(55% - 22px);top:4px;width:30px;height:16px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.3)}
.seg{display:inline-flex;align-self:flex-start;gap:2px;padding:4px;border-radius:16px;background:#E9ECF0;box-sizing:border-box}
.seg a{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:12px;font:500 14px/1 'Inter',sans-serif;color:#64748B}
.seg a.on{background:#fff;color:#0F172A;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.otp{width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(15,23,42,.06),0 2px 6px -2px rgba(15,23,42,.12);display:inline-flex;align-items:center;justify-content:center;font:500 20px/1 'Inter',sans-serif}
.tr{display:grid;grid-template-columns:150px minmax(0,1.6fr) 80px 150px 130px;align-items:center;gap:16px;min-height:60px;padding:0 18px;border-top:1px solid #EEF0F3}
.tr:first-child{border-top:0}
.tr.th{min-height:44px;border:0;font:500 12px/1 'Inter',sans-serif;color:#64748B}
.row{border-radius:12px;transition:background .15s}
.row:hover{background:#F2F4F7}
.ico{display:flex;align-items:center;justify-content:center;flex:none}
.link-ghost{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0;border-radius:8px;background:transparent;color:#1D4ED8;font:600 14px/1 'Plus Jakarta Sans',sans-serif;white-space:nowrap;flex:none}
.link-ghost svg{transition:transform .15s}.link-ghost:hover svg{transform:translateX(2px)}
.link-ghost svg{width:16px;height:16px}
.btn-start{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 12px;border-radius:12px;background:#E9ECF0;color:#1D4ED8;font:600 14px/1 'Plus Jakarta Sans',sans-serif;flex:none;transition:background .15s}
.btn-start:hover{background:#DEE2E8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 24px;border-radius:12px;font:600 16px/1 'Plus Jakarta Sans',sans-serif;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:#2563EB;color:#fff;box-shadow:0 8px 18px -10px rgba(37,99,235,.8)}.btn-primary:hover{background:#1D4ED8}
.sec{transition:box-shadow .2s}
.sec:hover{box-shadow:0 0 0 1px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.04),0 12px 28px -12px rgba(15,23,42,.18)!important}
.mx{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid #EEF0F3;font-size:13px;line-height:1.5;color:#475569}
.mx:first-of-type{border-top:0}
.mx b{font:600 13px/1.5 'Inter',sans-serif;color:#0F172A}

.m-demo .btn svg{width:16px;height:16px}

.mk{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:999px;background:#0F172A;color:#fff;font:700 11px/22px 'IBM Plex Mono',monospace;text-align:center}

.lv{width:22px;height:22px;flex:none;border-radius:999px;background:#0F172A;color:#fff;font:700 11px/22px 'IBM Plex Mono',monospace;text-align:center;margin-top:1px}

.sb i{position:relative;display:block;width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}

t;color:#475569"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12H5.01M12 12H12.01M19 12H19.01"></path></svg></button></div><span class="mk r opt">B</span></div><div class="hr-r"><span class="mk opt">A</span><span style="display:flex;align-items:flex-start;gap:6px;font:400 14px/1.4 'Inter',sans-serif;color:#334155"><span style="flex:none;margin-top:1px;color:#64748B;display:flex"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M4 4H20V16H8L4 20V4Z"></path></svg></span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">What you usually keep at home. It fills itself from your receipts.</span></span></div><div class="hr-r"><span class="mk">3</span><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px"><span class="tg"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3L14.6 8.6L20.7 9.3L16.2 13.5L17.4 19.6L12 16.6L6.6 19.6L7.8 13.5L3.3 9.3L9.4 8.6L12 3Z"></path></svg>Default</span><span class="tg"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M16 20V18C16 16.3 14.7 15 13 15H6C4.3 15 3 16.3 3 18V20"></path><path d="M9.5 11A3.5 3.5 0 1 0 9.5 4A3.5 3.5 0 0 0 9.5 11Z"></path><path d="M21 20V18C21 16.7 20.2 15.6 19 15.2"></path><path d="M16 4.2C17.2 4.6 18 5.7 18 7S17.2 9.4 16 9.8"></path></svg>Shared with Ana</span></div></div><div class="hr-r"><span class="mk">4</span><span style="font:400 14px/1.2 'Inter',sans-serif;color:#475569">Last trip 19 Feb, 2026</span></div><div class="hr-r" style="margin-top:2px;padding-top:10px;border-top:1px solid #EEF0F3"><span class="mk">5</span><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%"><span style="font:400 14px/1.2 'Inter',sans-serif;color:#475569"><b class="mono" style="font-size:16px;font-weight:600;color:#0F172A">24</b> items</span><a class="link-ghost" href="#">View Items<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6C9 6 15 10.42 15 12C15 13.58 9 18 9 18"></path></svg></a></div></div></div></div><div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:12px;align-items:flex-start"><span class="lv">1</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 14px/1.3 'Plus Jakarta Sans',sans-serif">Identidad</span><span style="font-size:14px;line-height:1.5;color:#475569">Tile con el color del objeto y el título, en una línea que se corta con puntos suspensivos.</span></div></div><div style="display:flex;gap:12px;align-items:flex-start"><span class="lv">2</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 14px/1.3 'Plus Jakarta Sans',sans-serif">Estado</span><span style="font-size:14px;line-height:1.5;color:#475569">Cero o una píldora en la fila del título, justificada a la derecha. Dice en qué punto del proceso está: Shopping, Reading, Processed, Completed, Failed.</span></div></div><div style="display:flex;gap:12px;align-items:flex-start"><span class="lv">3</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 14px/1.3 'Plus Jakarta Sans',sans-serif">Clasificación</span><span style="font-size:14px;line-height:1.5;color:#475569">Una sola fila y en este orden: la entidad y después hasta dos etiquetas. Incluye lo que antes se escribía en la línea de datos: la tienda, Defa opcional</span><span style="font-size:14px;line-height:1.5;color:#475569">Justo debajo del título, antes de la clasificación, porque describe al objeto. Mismo estilo que en la card: icono de nota 16px, Inter 400/14 #334155, hasta 2 líneas. Si no hay nota, se omite.</span></div></div><div style="display:flex;gap:12px;align-items:flex-start"><span class="lv">4</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 14px/1.3 'Plus Jakarta Sans',sans-serif">Datos</span><span style="font-size:14px;line-height:1.5;color:#475569">Una última línea con como máximo tres datos separados por “·”: cantidad, tiempo e importe total, que va al final junto a la fecha. Inter 14 #475569 con las cifras en IBM Plex Mono. Sustituye al texto mono 12 gris que usan hoy las pantallas.</span></div></div><div style="display:flex;gap:12px;align-items:flex-start"><span class="lv opt">B</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 14px/1.3 'Plus Jakarta Sans',sans-serif">Acciones ⋯ · opcional</span><span style="font-size:14px;line-height:1.5;color:#475569">El botón de tres puntos de 44px cierra la fila del título, igual que en la card. Si la pantalla tiene una acción principal (Add Receipt, Start Shopping), va como botón debajo de este encabezado, nunca en él.</span></div></div></div></div><span class="spec">Un encabezado de pantalla no tiene pie, así que le quedan cuatro niveles: título con su estado, clasificación, nota y datos. Son los mismos datos y los mismos componentes que en la card; solo cambia dónde se sitúan. Si un nivel está vacío se omite, nunca se deja hueco.</span></div><div class="demo" style="grid-column:1/-1"><span class="demo-t">Recetas · detalle de recibo, de trip y de lista</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="grp-t">Detalle de trip · con recibo</span><div style="display:flex;
